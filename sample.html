<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music App Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Layout Area */
    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 85px);
    }

    /* Left Sidebar */
    .sidebar {
      width: 220px;
      background-color: #000000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid #282828;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1db954;
      margin-bottom: 12px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-item a {
      color: #b3b3b3;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-item a:hover,
    .nav-item.active a {
      color: #ffffff;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      background: linear-gradient(180deg, #202020 0%, #121212 250px);
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    /* Track Cards Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #181818;
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      background-color: #282828;
      transform: translateY(-4px);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #333333;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 0.8rem;
      color: #b3b3b3;
    }

    /* Fixed Bottom Player Bar */
    .player-bar {
      height: 85px;
      background-color: #181818;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    /* Player - Left (Track Info) */
    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 25%;
    }

    .mini-cover {
      width: 48px;
      height: 48px;
      background-color: #333;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-details {
      font-size: 0.85rem;
    }

    .track-details .artist {
      font-size: 0.75rem;
      color: #b3b3b3;
    }

    /* Player - Center (Controls & Scrubber) */
    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 50%;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .btn {
      background: none;
      border: none;
      color: #b3b3b3;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn:hover {
      color: #ffffff;
    }

    .btn-play {
      background-color: #ffffff;
      color: #000000;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .btn-play:hover {
      transform: scale(1.06);
    }

    .playback-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: #b3b3b3;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: #4f4f4f;
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      width: 35%;
      height: 100%;
      background-color: #1db954;
      border-radius: 2px;
    }

    /* Player - Right (Volume) */
    .volume-controls {
      width: 25%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #b3b3b3;
    }

    .volume-slider {
      width: 80px;
      height: 4px;
      background-color: #4f4f4f;
      border-radius: 2px;
      accent-color: #1db954;
    }
  </style>
</head>
<body>

  <!-- Main View Area -->
  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">StreamPulse</div>
      <ul class="nav-list">
        <li class="nav-item active"><a href="#">Home</a></li>
        <li class="nav-item"><a href="#">Search</a></li>
        <li class="nav-item"><a href="#">Your Library</a></li>
      </ul>
    </aside>

    <!-- Main Content Grid -->
    <main class="main-content">
      <h2 class="section-title">Trending Now</h2>
      <div class="card-grid">
        <div class="card">
          <div class="card-cover">🎧</div>
          <div class="card-title">Midnight Drive</div>
          <div class="card-artist">Synthwave Boy</div>
        </div>
        <div class="card">
          <div class="card-cover">🎸</div>
          <div class="card-title">Electric Echoes</div>
          <div class="card-artist">The Solars</div>
        </div>
        <div class="card">
          <div class="card-cover">🎹</div>
          <div class="card-title">Lo-Fi Study Beats</div>
          <div class="card-artist">Chill Valley</div>
        </div>
        <div class="card">
          <div class="card-cover">🎷</div>
          <div class="card-title">Sunset Jazz</div>
          <div class="card-artist">Blue Note Trio</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Persistent Bottom Player Bar -->
  <footer class="player-bar">
    <!-- Left: Current Track -->
    <div class="now-playing">
      <div class="mini-cover">🎧</div>
      <div class="track-details">
        <p><strong>Midnight Drive</strong></p>
        <p class="artist">Synthwave Boy</p>
      </div>
    </div>

    <!-- Center: Playback Controls -->
    <div class="player-controls">
      <div class="buttons">
        <button class="btn">⏮</button>
        <button class="btn btn-play">▶</button>
        <button class="btn">⏭</button>
      </div>
      <div class="playback-bar">
        <span>1:12</span>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <span>3:45</span>
      </div>
    </div>

    <!-- Right: Volume -->
    <div class="volume-controls">
      <span>🔊</span>
      <input type="range" class="volume-slider" min="0" max="100" value="70" />
    </div>
  </footer>

</body>
</html>
